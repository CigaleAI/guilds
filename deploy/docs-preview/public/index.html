<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>guilds.run docs</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101114;
        --panel: #181a1f;
        --text: #e8eaed;
        --muted: #9aa0a6;
        --link: #8ab4f8;
        --border: #2a2d34;
        --hit: #1e3a5f;
        --code: #0b0c0f;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; }
      body { display: grid; grid-template-columns: 340px 1fr; }
      aside { border-right: 1px solid var(--border); background: var(--panel); overflow: auto; padding: 16px; }
      main { overflow: auto; padding: 24px 36px 80px; }
      aside h1 { font-size: 16px; margin: 0 0 12px; }
      aside h2 { font-size: 12px; color: var(--muted); font-weight: 600; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      form { display: flex; gap: 8px; margin-bottom: 12px; }
      input[type="search"] {
        flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 8px 10px;
      }
      form button, .hit {
        background: #2b5aa8; color: white; border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer;
      }
      .hit {
        display: block; width: 100%; text-align: left; background: transparent; color: var(--text);
        border: 1px solid var(--border); margin: 0 0 8px;
      }
      .hit:hover, .hit.active { background: var(--hit); border-color: var(--link); }
      .hit strong { display: block; color: var(--link); font-size: 13px; }
      .hit span { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
      nav a { display: block; padding: 4px 0; color: var(--text); }
      nav a.active { color: var(--link); }
      .meta { color: var(--muted); font-size: 12px; margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
      .empty { color: var(--muted); }
      .flash { outline: 2px solid var(--link); outline-offset: 4px; }
      article { max-width: 1100px; }
      article :is(h1, h2, h3, h4) { color: var(--text); text-transform: none; letter-spacing: 0; line-height: 1.25; }
      article h1 { font-size: 2rem; margin: 0 0 0.8em; }
      article h2 { font-size: 1.35rem; margin: 1.6em 0 0.6em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
      article h3 { font-size: 1.15rem; margin: 1.3em 0 0.5em; }
      article p { margin: 0.7em 0; }
      article :is(ul, ol) { padding-left: 1.4em; }
      article li { margin: 0.25em 0; }
      article hr { border: 0; border-top: 1px solid var(--border); margin: 2em 0; }
      article blockquote {
        margin: 1em 0; padding: 0.2em 1em; border-left: 3px solid var(--link); color: var(--muted);
      }
      article .table-wrap { overflow-x: auto; margin: 1em 0; }
      article table { border-collapse: collapse; width: 100%; }
      article th, article td {
        border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top;
        overflow-wrap: anywhere;
      }
      article th { background: #1c1f26; font-weight: 600; }
      article tr:nth-child(even) td { background: #14161b; }
      article pre, article code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      article code {
        background: #1c1f26; padding: 0.15em 0.4em; border-radius: 4px;
      }
      article pre {
        background: var(--code); padding: 12px 14px; overflow: auto; border: 1px solid var(--border); border-radius: 8px;
      }
      article pre code { background: transparent; padding: 0; }
      article img { max-width: 100%; }
      .mermaid { background: #0b0c0f; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 1em 0; overflow-x: auto; }
      .mermaid svg { max-width: 100%; height: auto; }
    </style>
    <script src="/vendor/marked.min.js"></script>
    <script src="/vendor/mermaid.min.js"></script>
  </head>
  <body>
    <aside>
      <h1>Search docs</h1>
      <form id="search">
        <input id="q" type="search" placeholder="AUTH_MODE, sandbox idle…" minlength="3" required />
        <button type="submit">Search</button>
      </form>
      <div id="status" class="empty">Matching segments, not a generated answer.</div>
      <div id="results"></div>
      <h2>Chapters</h2>
      <nav id="nav"><p class="empty">Loading…</p></nav>
    </aside>
    <main>
      <div class="meta" id="meta"></div>
      <article id="article"><p class="empty">Search or pick a chapter.</p></article>
    </main>
    <script>
      const nav = document.getElementById("nav");
      const article = document.getElementById("article");
      const meta = document.getElementById("meta");
      const results = document.getElementById("results");
      const status = document.getElementById("status");
      const form = document.getElementById("search");
      const q = document.getElementById("q");
      const allowed = /^(?:[A-Za-z0-9._-]+\/)*[A-Za-z0-9._-]+\.md$/;
      const home = "README.md";
      let lastConfig = { hostRoot: "" };

      mermaid.initialize({
        startOnLoad: false,
        theme: "dark",
        securityLevel: "loose",
        fontFamily: "ui-sans-serif, system-ui, sans-serif",
      });

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      function chapterPath(path) {
        const cleaned = String(path || "").replace(/\\/g, "/").replace(/^\.?\//, "");
        const withoutDocs = cleaned.replace(/^(?:docs\/)+/, "");
        return allowed.test(withoutDocs) ? withoutDocs : "";
      }

      function chapterUrl(name) {
        return "/chapters/" + String(name || "").split("/").map(encodeURIComponent).join("/");
      }

      function resolveHref(fromChapter, href) {
        const [path, hash] = href.split("#");
        const base = (path || "").split("?")[0];
        if (!base) return { name: "", hash: hash || "" };
        const fromDir = fromChapter.includes("/")
          ? fromChapter.slice(0, fromChapter.lastIndexOf("/") + 1)
          : "";
        try {
          const resolved = new URL(base, "https://docs.local/" + fromDir).pathname.replace(/^\//, "");
          return { name: chapterPath(resolved), hash: hash || "" };
        } catch {
          return { name: chapterPath(base), hash: hash || "" };
        }
      }

      function rewriteLinks(root, config, fromChapter) {
        const repoRoot = String(config.hostRoot || "").replace(/\/docs\/?$/, "");
        for (const link of root.querySelectorAll("a[href]")) {
          const href = link.getAttribute("href") || "";
          if (href.startsWith("#") || href.startsWith("mailto:") || href.includes("://")) continue;
          const { name, hash } = resolveHref(fromChapter, href);
          if (name) {
            link.setAttribute("href", "#" + encodeURIComponent(name) + (hash ? "#" + hash : ""));
            continue;
          }
          const [path] = href.split("#");
          const base = path.split("?")[0];
          if (base.startsWith("../") && repoRoot) {
            const resolved = base.replace(/^\.\.\//, "");
            link.setAttribute("href", "vscode://file" + repoRoot + "/" + resolved);
          }
        }
        for (const table of root.querySelectorAll("table")) {
          if (table.parentElement?.classList.contains("table-wrap")) continue;
          const wrap = document.createElement("div");
          wrap.className = "table-wrap";
          table.replaceWith(wrap);
          wrap.appendChild(table);
        }
      }

      async function renderMarkdown(src, fromChapter) {
        article.innerHTML = marked.parse(src, { gfm: true, breaks: false });
        rewriteLinks(article, lastConfig, fromChapter);
        const blocks = [...article.querySelectorAll("pre > code.language-mermaid")];
        for (const code of blocks) {
          const pre = code.parentElement;
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = code.textContent;
          pre.replaceWith(div);
        }
        if (article.querySelector(".mermaid")) {
          try {
            await mermaid.run({ querySelector: "#article .mermaid" });
          } catch (error) {
            console.error(error);
          }
        }
      }

      function currentName() {
        const raw = decodeURIComponent(location.hash.replace(/^#/, "").split("#")[0]);
        return allowed.test(raw) ? raw : "";
      }

      function clip(text, n = 220) {
        const flat = String(text || "").replace(/\s+/g, " ").trim();
        return flat.length > n ? flat.slice(0, n) + "…" : flat;
      }

      function flashSnippet(snippet) {
        const needle = String(snippet || "").replace(/\s+/g, " ").trim().slice(0, 40);
        if (!needle) return;
        for (const el of article.querySelectorAll("p, li, h1, h2, h3, td, th, pre")) {
          if (el.textContent.replace(/\s+/g, " ").includes(needle)) {
            el.classList.add("flash");
            el.scrollIntoView({ block: "center" });
            return;
          }
        }
      }

      async function listMarkdown(prefix = "") {
        const url = prefix ? chapterUrl(prefix) : "/chapters/";
        const rows = await fetch(url).then((r) => r.json());
        if (!Array.isArray(rows)) return [];
        const files = [];
        for (const row of rows) {
          if (row.type === "directory") {
            files.push(...await listMarkdown(prefix + row.name + "/"));
          } else if (row.type === "file" && allowed.test(prefix + row.name)) {
            files.push(prefix + row.name);
          }
        }
        return files;
      }

      async function loadList() {
        const files = (await listMarkdown()).sort((a, b) => {
          if (a === home) return -1;
          if (b === home) return 1;
          return a.localeCompare(b, "en", { numeric: true });
        });
        nav.innerHTML = files
          .map((name) => `<a href="#${encodeURIComponent(name)}" data-name="${name}">${name}</a>`)
          .join("");
        return files;
      }

      async function loadChapter(name, snippet) {
        lastConfig = await fetch("/config.json").then((r) => r.json()).catch(() => ({ hostRoot: "" }));
        const markdown = await fetch(chapterUrl(name)).then((r) => {
          if (!r.ok) throw new Error("missing chapter");
          return r.text();
        });
        await renderMarkdown(markdown, name);
        const cursorHref = lastConfig.hostRoot
          ? "vscode://file" + lastConfig.hostRoot.replace(/\/$/, "") + "/" + name
          : "";
        meta.innerHTML =
          `<span>${name}</span>` +
          (cursorHref ? `<a href="${cursorHref}">Open in Cursor</a>` : "") +
          `<a href="${chapterUrl(name)}">Raw markdown</a>`;
        for (const link of nav.querySelectorAll("a")) {
          link.classList.toggle("active", link.dataset.name === name);
        }
        if (snippet) flashSnippet(snippet);
      }

      async function searchDocs(query) {
        status.textContent = "Searching segments…";
        results.innerHTML = "";
        const response = await fetch("/query/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            query,
            mode: "naive",
            enable_rerank: false,
            include_references: true,
            include_chunk_content: true,
            chunk_top_k: 20,
            top_k: 20,
          }),
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || payload.message || `HTTP ${response.status}`);
        }
        const chunks = Array.isArray(payload.data && payload.data.chunks) ? payload.data.chunks : [];
        if (chunks.length === 0) {
          status.textContent = "No matching segments.";
          return;
        }
        status.textContent = chunks.length + " matching segments";
        results.innerHTML = chunks.map((chunk, i) => {
          const name = chapterPath(chunk.file_path || chunk.source);
          const text = chunk.content || chunk.text || "";
          if (!name) return "";
          return `<button class="hit" data-name="${name}" data-i="${i}">
            <strong>${escapeHtml(name)}</strong>
            <span>${escapeHtml(clip(text))}</span>
          </button>`;
        }).join("");
        for (const button of results.querySelectorAll(".hit")) {
          button.addEventListener("click", () => {
            for (const other of results.querySelectorAll(".hit")) other.classList.remove("active");
            button.classList.add("active");
            const name = button.dataset.name;
            const snippet = button.querySelector("span")?.textContent || "";
            if (currentName() === name) {
              loadChapter(name, snippet);
            } else {
              sessionStorage.setItem("docs-snippet", snippet);
              location.hash = encodeURIComponent(name);
            }
          });
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const query = q.value.trim();
        if (query.length < 3) {
          status.textContent = "Type at least 3 characters.";
          return;
        }
        searchDocs(query).catch((error) => {
          status.textContent = String(error);
        });
      });

      window.addEventListener("hashchange", () => {
        const name = currentName();
        const snippet = sessionStorage.getItem("docs-snippet") || "";
        sessionStorage.removeItem("docs-snippet");
        if (name) loadChapter(name, snippet);
      });

      loadList()
        .then((files) => {
          const name = currentName();
          if (name) return loadChapter(name);
          const first = files.includes(home) ? home : files[0];
          if (first) {
            location.hash = encodeURIComponent(first);
          }
        })
        .catch((error) => {
          article.innerHTML = `<p class="empty">${escapeHtml(String(error))}</p>`;
        });
    </script>
  </body>
</html>
