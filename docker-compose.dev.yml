# Local development of core alone: product stack with the orchestrator restarting on source
# changes, + localhost docs search.
# Usage: docker compose -f docker-compose.dev.yml up
# Never use this file for the hosted public box.
name: guilds

include:
  - path:
      - docker-compose.yml
      - docker-compose.watch.yml
  - path: docker-compose.docs.yml
