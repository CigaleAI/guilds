name: Feature request
description: Propose a feature for guilds.run
labels: ["feature request"]
body:
  - type: markdown
    attributes:
      value: |
        One feature per issue. The Why is enough to open it; the other fields make it ready ([Issues](https://github.com/CigaleAI/guilds/blob/main/docs/CONTRIBUTING.md#issues)).
  - type: input
    id: outcome
    attributes:
      label: Outcome
      description: One sentence in the imperative. It is the pull request's title.
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The job you are doing and what the product does not do for it today. Not the solution.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where
      description: The doc page that describes the behaviour today, and the entry point (route, agent tool, Studio view, or domain directory).
  - type: textarea
    id: behaviour
    attributes:
      label: Behaviour
      description: What the operator sees and does once the feature exists, with the refusals. Leave the implementation out.
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The test that fails today and passes when done, as suite and assertion. For a view, the steps a person runs in the app and what they see.
  - type: textarea
    id: size
    attributes:
      label: Size
      description: The one domain directory under src/ it touches, with its routes, tests, and docs page. Three commits or fewer, or split it.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What stays as it is.
  - type: textarea
    id: breaks
    attributes:
      label: Breaks
      description: None, or the route, event, type, export, or storage format that changes.
